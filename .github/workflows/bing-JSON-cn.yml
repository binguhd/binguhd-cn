# .github/workflows/bing-JSON-cn.yml
name: bing-JSON-cn

on:
  # 手动触发，可选择年份
  workflow_dispatch:
    inputs:
      year:
        description: '选择年份（例如 2022、2023、2024）'
        required: true
        default: '2026'
        type: choice
        options:
          - '2020'
          - '2021'
          - '2022'
          - '2023'
          - '2024'
          - '2025'
          - '2026'

  # 可选：每天定时运行（默认跑当前年份）
  # schedule:
    # - cron: '0 3 * * *'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine run year
        id: year
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.year }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date +%Y)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check JSON file
        run: |
          YEAR=${{ steps.year.outputs.value }}
          if [ ! -f "bing-JSON-cn-${YEAR}.json" ]; then
            echo "❌ 未找到 bing-JSON-cn-${YEAR}.json"
            exit 1
          fi
          echo "✅ 使用 bing-JSON-cn-${YEAR}.json"

      - name: Run download script
        run: |
          python bing-JSON-cn.py --year ${{ steps.year.outputs.value }}

      - name: Commit changes
        run: |
          YEAR=${{ steps.year.outputs.value }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "bing-UHD-cn-${YEAR}" "bing-320-cn-${YEAR}" "bing-UHD-cn-${YEAR}.md"
          if git diff --cached --quiet; then
            echo "ℹ️ 没有需要提交的变更"
          else
            git commit -m "chore: 更新 Bing 壁纸 ${YEAR} ($(date -u +%Y-%m-%d))"
            git push
          fi
